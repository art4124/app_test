name: Validate Vune Web

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check vune-runtime.js
          node --check public-theme.js
          node --check service-worker.js
          node --check audit-check.mjs

      - name: Run Vune static audit
        run: node audit-check.mjs

      - name: Check required production files
        run: |
          test -f index.html
          test -f vune.css
          test -f vune-runtime.js
          test -f public-theme.js
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f privacy.html
          test -f terms.html
          test -f SECURITY.md
          test -f README.md

      - name: Confirm legacy runtime fragments are retired
        run: |
          test ! -f app.js
          test ! -f corrections.js
          test ! -f batch-2026-09-25.js
          test ! -f subscription-switch-fix.js
          test ! -f surgical-fixes-2026-09-25.js
          test ! -f calendar-expand.js
          test ! -f styles.css
          test ! -f enhancements.css
          test ! -f corrections.css
          test ! -f batch-2026-09-25.css
          test ! -f screenshot-fixes.css
          test ! -f surgical-fixes-2026-09-25.css

      - name: Verify privacy guardrails
        run: |
          grep -q "connect-src 'none'" index.html
          grep -q "AES-GCM" vune-runtime.js
          grep -q "PBKDF2" vune-runtime.js
          ! grep -Eqi "googletagmanager|google-analytics|facebook\\.net|segment\\.com|mixpanel|amplitude" index.html vune-runtime.js
